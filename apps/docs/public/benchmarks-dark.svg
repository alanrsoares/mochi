<svg xmlns="http://www.w3.org/2000/svg" width="640" height="604" viewBox="0 0 640 604" role="img" aria-labelledby="title description">
  <title id="title">Mochi runtime optimization snapshots</title>
  <desc id="description">Deduplicate records by ID, 4,000 unique IDs · numeric projection keys: Bun 186×, Node 202×. Sum through a tail switch, 2 million loop iterations: Bun 2.8×, Node 14×. Match optional field reads, 1 million immediate Some / None matches: Bun 2.9×, Node 2.9×. Historical median speedups against previous Mochi implementations; microbenchmarks, not application throughput.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f0f6fc; }
    .name { font-size: 20px; font-weight: 600; }
    .size, .muted { font-size: 14px; fill: #9198a1; }
    .engine { font-size: 14px; font-weight: 600; fill: #9198a1; }
    .gain { font-size: 28px; font-weight: 600; fill: #3fb950; }
    .timing { font-size: 16px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .divider { stroke: #30363d; }
  </style>
  <rect x="0.5" y="0.5" width="639" height="603" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="43" font-size="22" font-weight="600">Runtime optimization snapshots</text>
  <text x="32" y="68" class="muted">Historical medians · previous → optimized Mochi</text>

  <path d="M24 92H616" class="divider"/>
  <text x="48" y="121" class="name">Deduplicate records by ID</text>
  <text x="48" y="143" class="size">4,000 unique IDs · numeric projection keys</text>

  <text x="48" y="177" class="engine">Bun</text>
  <text x="113" y="179" class="gain">186×</text>
  <text x="48" y="206" class="timing">27.031 → 0.145 ms</text>

  <text x="344" y="177" class="engine">Node</text>
  <text x="409" y="179" class="gain">202×</text>
  <text x="344" y="206" class="timing">50.825 → 0.251 ms</text>

  <path d="M24 240H616" class="divider"/>
  <text x="48" y="269" class="name">Sum through a tail switch</text>
  <text x="48" y="291" class="size">2 million loop iterations</text>

  <text x="48" y="325" class="engine">Bun</text>
  <text x="113" y="327" class="gain">2.8×</text>
  <text x="48" y="354" class="timing">31.29 → 11.19 ms</text>

  <text x="344" y="325" class="engine">Node</text>
  <text x="409" y="327" class="gain">14×</text>
  <text x="344" y="354" class="timing">41.79 → 2.93 ms</text>

  <path d="M24 388H616" class="divider"/>
  <text x="48" y="417" class="name">Match optional field reads</text>
  <text x="48" y="439" class="size">1 million immediate Some / None matches</text>

  <text x="48" y="473" class="engine">Bun</text>
  <text x="113" y="475" class="gain">2.9×</text>
  <text x="48" y="502" class="timing">7.79 → 2.65 ms</text>

  <text x="344" y="473" class="engine">Node</text>
  <text x="409" y="475" class="gain">2.9×</text>
  <text x="344" y="502" class="timing">4.16 → 1.44 ms</text>
  <path d="M24 536H616" class="divider"/>
  <text x="32" y="559" class="muted">Bun 1.4.2 · Node 22.22.3 · macOS arm64</text>
  <text x="32" y="581" class="muted">Measured October 2–3, 2026 · Microbenchmarks, not app throughput.</text>
</svg>
