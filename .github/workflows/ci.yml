name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs on two runners: `check` is the everyday gate, `check:north-star` is
  # what `check:full` adds (graph-sized north-star specs, bootstrap coverage,
  # seed:check). Together they are `check:full`; apart, neither starves the other
  # of the runner's four cores.
  check:
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate: [check, "check:north-star"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Content-addressed graph caches. Key patterns match BOOTSTRAP_CACHE_GLOBS
      # in packages/test-support/src/bootstrap.ts. Saved only after a green gate:
      # a failed run can hold a half-written emit, and storing that under the
      # final key would make every later hit rebuild it and never replace it.
      - name: Restore bootstrap graph cache
        id: bootstrap-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/bootstrap-build
            .cache/bootstrap-ts-emit
          key: bootstrap-graph-${{ hashFiles('bootstrap/**/*.mochi', 'bootstrap/seed/**/*.ts', 'bootstrap/seed/**/*.cjs', 'bootstrap/seed/**/*.mjs', 'bootstrap/seed/**/*.d.mts', 'packages/compiler/src/bootstrap/**/*.ts', 'packages/test-support/src/bootstrap.ts') }}

      # `check`: biome + tsc --noEmit + workspace checks (docs vite build included
      # via @mochi/docs) + formatter dogfood + the parallel test suite.
      # `check:north-star`: the tsc --strict-clean ratchets, the byte-exact
      # fixpoint reproduction, bootstrap Mochi coverage, and the seed freshness diff.
      - run: bun run ${{ matrix.gate }}

      - name: Save bootstrap graph cache
        if: success() && steps.bootstrap-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/bootstrap-build
            .cache/bootstrap-ts-emit
          key: ${{ steps.bootstrap-cache.outputs.cache-primary-key }}
