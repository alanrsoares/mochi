name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The complete quality gate: biome + tsc --noEmit + workspace checks (docs
      # vite build included via @mochi/docs) + formatter dogfood + the full test
      # suite, including the two self-hosting north-stars — the tsc --strict-clean
      # ratchet (bootstrap-tsc.spec.ts) and the byte-exact fixpoint reproduction
      # (bootstrap-fixpoint-binary.spec.ts). Local day-to-day uses `bun run check`
      # (same gate without those two specs).
      - run: bun run check:full
