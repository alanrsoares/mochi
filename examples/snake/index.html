<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Canvas Snake — Powered by Bun.serve</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "@onrails/pattern": "/node_modules/@onrails/pattern/dist/index.js"
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-green: #00ff87;
      --accent-green-glow: rgba(0, 255, 135, 0.4);
      --accent-pink: #ff007f;
      --accent-pink-glow: rgba(255, 0, 127, 0.5);
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --grid-color: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 255, 135, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .app-layout {
      width: 100%;
      max-width: 1040px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 840px) {
      .app-layout {
        grid-template-columns: 1fr 340px;
      }
    }

    .main-section {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-green), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-badge {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 255, 135, 0.12);
      color: var(--accent-green);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 135, 0.25);
    }

    .ws-status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
    }

    .ws-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }

    .ws-status.connected .ws-dot {
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green-glow);
    }

    .scores {
      display: flex;
      gap: 1.5rem;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .score-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .score-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-green);
      text-shadow: 0 0 10px var(--accent-green-glow);
    }

    .score-value.high {
      color: #f59e0b;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--card-border);
      background: #0d121f;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .overlay-title.game-over {
      color: var(--accent-pink);
      text-shadow: 0 0 20px var(--accent-pink-glow);
    }

    .overlay-title.paused {
      color: #60a5fa;
    }

    .overlay-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 320px;
      line-height: 1.4;
    }

    .score-submit-form {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 280px;
      margin-top: 0.5rem;
    }

    .score-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 0.6rem 0.8rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .score-input:focus {
      border-color: var(--accent-green);
    }

    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.6rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-green), #059669);
      color: #042f1a;
      box-shadow: 0 6px 20px var(--accent-green-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 255, 135, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      box-shadow: none;
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }

    .controls-legend {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .key-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 0.15rem 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-main);
    }

    /* Leaderboard Panel */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .leaderboard-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      height: 100%;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-badge {
      font-size: 0.7rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-pink);
      background: rgba(255, 0, 127, 0.12);
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 0, 127, 0.25);
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      list-style: none;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0.8rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.88rem;
      transition: background 0.2s ease;
    }

    .leaderboard-item.top-1 {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.03));
      border-color: rgba(245, 158, 11, 0.3);
    }

    .rank {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      width: 24px;
      color: var(--text-muted);
    }

    .top-1 .rank { color: #f59e0b; }
    .top-2 .rank { color: #94a3b8; }
    .top-3 .rank { color: #b45309; }

    .player-name {
      flex: 1;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--accent-green);
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .audio-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div class="main-section">
      <header>
        <div class="logo">
          <span class="logo-badge">Mochi</span> Snake
          <span class="sub-badge">Bun.serve</span>
        </div>
        <div class="scores">
          <div class="score-box">
            <span class="score-label">Score</span>
            <span class="score-value" id="score-val">0</span>
          </div>
          <div class="score-box">
            <span class="score-label">High Score</span>
            <span class="score-value high" id="high-val">0</span>
          </div>
        </div>
      </header>

      <div class="canvas-wrapper">
        <canvas id="game-canvas" width="600" height="600"></canvas>
        
        <div class="overlay visible" id="overlay">
          <div class="overlay-title" id="overlay-title">Ready?</div>
          <div class="overlay-subtitle" id="overlay-sub">Press Space or Start Game to play. Use Arrow keys or WASD to navigate.</div>
          
          <div class="score-submit-form" id="submit-form" style="display: none;">
            <input type="text" id="player-name" class="score-input" placeholder="Enter Callsign" maxlength="12">
            <button class="btn" id="submit-score-btn">Submit</button>
          </div>

          <button class="btn" id="start-btn">Start Game</button>
        </div>
      </div>

      <div class="controls-legend">
        <div class="key-group"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
        <div class="key-group"><kbd>Space</kbd> Pause</div>
        <div class="key-group"><kbd>R</kbd> Restart</div>
        <button class="audio-btn" id="audio-toggle">🔊 Sound: ON</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="leaderboard-card">
        <div class="card-title">
          <span>Global Leaderboard</span>
          <span class="card-badge">Bun WS</span>
        </div>
        <div class="ws-status connected" id="ws-status">
          <span class="ws-dot"></span>
          <span id="ws-label">Syncing...</span>
        </div>
        <ul class="leaderboard-list" id="leaderboard-list">
          <li class="leaderboard-item"><span class="player-name">Loading...</span></li>
        </ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { initGame, step, changeDir, startGame, togglePause } from './snake.js';

    const Up = { _tag: "Up" };
    const Down = { _tag: "Down" };
    const Left = { _tag: "Left" };
    const Right = { _tag: "Right" };

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const scoreVal = document.getElementById('score-val');
    const highVal = document.getElementById('high-val');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');
    const submitForm = document.getElementById('submit-form');
    const playerNameInput = document.getElementById('player-name');
    const submitScoreBtn = document.getElementById('submit-score-btn');
    const leaderboardList = document.getElementById('leaderboard-list');
    const wsStatus = document.getElementById('ws-status');
    const wsLabel = document.getElementById('ws-label');
    const audioToggle = document.getElementById('audio-toggle');

    const COLS = 20;
    const ROWS = 20;
    const CELL_SIZE = canvas.width / COLS;

    let highScore = parseInt(localStorage.getItem('mochi_snake_highscore') || '0', 10);
    highVal.textContent = highScore;

    let soundEnabled = localStorage.getItem('mochi_snake_sound') !== 'false';
    updateAudioBtn();

    let state = initGame(COLS, ROWS, highScore);
    let lastTime = 0;
    const TICK_INTERVAL = 110;

    let particles = [];

    // Web Audio Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx && soundEnabled) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function updateAudioBtn() {
      audioToggle.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
    }

    audioToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('mochi_snake_sound', soundEnabled.toString());
      updateAudioBtn();
      if (soundEnabled) initAudio();
    });

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'die') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    // Particle FX on food eaten
    function spawnParticles(x, y) {
      const px = x * CELL_SIZE + CELL_SIZE / 2;
      const py = y * CELL_SIZE + CELL_SIZE / 2;
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: px,
          y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color: Math.random() > 0.5 ? '#ff007f' : '#00ff87'
        });
      }
    }

    function updateAndDrawParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    // WebSocket Client
    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;
      let ws;

      try {
        ws = new WebSocket(wsUrl);
      } catch {
        setOfflineWS();
        return;
      }

      ws.onopen = () => {
        wsStatus.className = 'ws-status connected';
        wsLabel.textContent = 'Live Server';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'LEADERBOARD_UPDATE') {
            renderLeaderboard(data.leaderboard);
          }
        } catch {}
      };

      ws.onclose = () => {
        setOfflineWS();
        setTimeout(connectWS, 3000);
      };

      ws.onerror = () => {
        setOfflineWS();
      };
    }

    function setOfflineWS() {
      wsStatus.className = 'ws-status';
      wsLabel.textContent = 'Offline (Local)';
    }

    function renderLeaderboard(list) {
      if (!list || list.length === 0) {
        leaderboardList.innerHTML = '<li class="leaderboard-item"><span class="player-name">No scores yet</span></li>';
        return;
      }
      leaderboardList.innerHTML = list.map((item, idx) => `
        <li class="leaderboard-item top-${idx + 1}">
          <span class="rank">#${idx + 1}</span>
          <span class="player-name">${escapeHtml(item.name)}</span>
          <span class="player-score">${item.score}</span>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Fetch initial leaderboard via REST
    fetch('/api/leaderboard')
      .then(res => res.json())
      .then(renderLeaderboard)
      .catch(() => {});

    connectWS();

    // Submit High Score to Bun.serve
    async function submitScore() {
      const name = playerNameInput.value.trim() || 'Anonymous';
      const score = state.score;
      if (score <= 0) return;

      try {
        await fetch('/api/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, score })
        });
        submitForm.style.display = 'none';
      } catch (err) {
        console.error('Failed to submit score:', err);
      }
    }

    submitScoreBtn.addEventListener('click', submitScore);

    function getRandomFood(snake) {
      let candidate;
      let valid = false;
      while (!valid) {
        const rx = Math.floor(Math.random() * COLS);
        const ry = Math.floor(Math.random() * ROWS);
        candidate = [rx, ry];
        valid = !snake.some(([sx, sy]) => sx === rx && sy === ry);
      }
      return candidate;
    }

    function updateUI() {
      scoreVal.textContent = state.score;
      if (state.highScore > highScore) {
        highScore = state.highScore;
        highVal.textContent = highScore;
        localStorage.setItem('mochi_snake_highscore', highScore.toString());
      }

      const status = state.status._tag;
      if (status === 'Ready') {
        overlayTitle.textContent = 'Ready?';
        overlayTitle.className = 'overlay-title';
        overlaySub.textContent = 'Press Space or click Start to begin.';
        submitForm.style.display = 'none';
        startBtn.textContent = 'Start Game';
        overlay.classList.add('visible');
      } else if (status === 'Paused') {
        overlayTitle.textContent = 'Paused';
        overlayTitle.className = 'overlay-title paused';
        overlaySub.textContent = 'Press Space to resume.';
        submitForm.style.display = 'none';
        startBtn.textContent = 'Resume';
        overlay.classList.add('visible');
      } else if (status === 'GameOver') {
        overlayTitle.textContent = 'Game Over';
        overlayTitle.className = 'overlay-title game-over';
        overlaySub.textContent = `Final Score: ${state.score}`;

        if (state.score > 0) {
          submitForm.style.display = 'flex';
          playerNameInput.focus();
        } else {
          submitForm.style.display = 'none';
        }

        startBtn.textContent = 'Play Again';
        overlay.classList.add('visible');
      } else {
        overlay.classList.remove('visible');
      }
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL_SIZE, 0);
        ctx.lineTo(c * CELL_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL_SIZE);
        ctx.lineTo(canvas.width, r * CELL_SIZE);
        ctx.stroke();
      }
    }

    function drawFood(x, y) {
      const px = x * CELL_SIZE + CELL_SIZE / 2;
      const py = y * CELL_SIZE + CELL_SIZE / 2;
      const radius = CELL_SIZE / 2 - 3;

      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 15;

      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px - radius * 0.3, py - radius * 0.3, radius * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnake(snake) {
      ctx.shadowColor = '#00ff87';
      ctx.shadowBlur = 10;

      const pad = 1.5;
      const radiusSize = CELL_SIZE / 2;

      snake.forEach(([x, y], idx) => {
        const px = x * CELL_SIZE;
        const py = y * CELL_SIZE;
        const size = CELL_SIZE - pad * 2;
        const isHead = idx === 0;
        const isTail = idx === snake.length - 1;

        ctx.fillStyle = isHead ? '#00ff87' : 'rgba(0, 255, 135, 0.85)';
        
        let radii = [4, 4, 4, 4];

        if (!isHead && !isTail) {
          const [prevX, prevY] = snake[idx - 1];
          const [nextX, nextY] = snake[idx + 1];

          const dirIn = prevX < x ? 'left' : prevX > x ? 'right' : prevY < y ? 'up' : 'down';
          const dirOut = nextX < x ? 'left' : nextX > x ? 'right' : nextY < y ? 'up' : 'down';

          const isCorner = dirIn !== dirOut && ((dirIn === 'left' || dirIn === 'right') !== (dirOut === 'left' || dirOut === 'right'));
          
          if (isCorner) {
            const hasUp = dirIn === 'up' || dirOut === 'up';
            const hasDown = dirIn === 'down' || dirOut === 'down';
            const hasLeft = dirIn === 'left' || dirOut === 'left';
            const hasRight = dirIn === 'right' || dirOut === 'right';

            radii = [
              (hasRight && hasDown) ? radiusSize : 2,
              (hasLeft && hasDown)  ? radiusSize : 2,
              (hasLeft && hasUp)    ? radiusSize : 2,
              (hasRight && hasUp)   ? radiusSize : 2
            ];
          } else {
            radii = [2, 2, 2, 2];
          }
        }

        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, radii);
        ctx.fill();

        if (isHead) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#042f1a';
          const eyeSize = 3;
          const [nextX, nextY] = snake.length > 1 ? snake[1] : [x - 1, y];
          const hDir = x > nextX ? 'right' : x < nextX ? 'left' : y > nextY ? 'down' : 'up';

          let eye1 = [px + size * 0.3, py + size * 0.3];
          let eye2 = [px + size * 0.7, py + size * 0.3];

          if (hDir === 'right') {
            eye1 = [px + size * 0.7, py + size * 0.3];
            eye2 = [px + size * 0.7, py + size * 0.7];
          } else if (hDir === 'left') {
            eye1 = [px + size * 0.3, py + size * 0.3];
            eye2 = [px + size * 0.3, py + size * 0.7];
          } else if (hDir === 'down') {
            eye1 = [px + size * 0.3, py + size * 0.7];
            eye2 = [px + size * 0.7, py + size * 0.7];
          }

          ctx.beginPath();
          ctx.arc(eye1[0], eye1[1], eyeSize, 0, Math.PI * 2);
          ctx.arc(eye2[0], eye2[1], eyeSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = '#00ff87';
          ctx.shadowBlur = 10;
        }
      });

      ctx.shadowBlur = 0;
    }

    function render() {
      ctx.fillStyle = '#0d121f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      if (state.food) drawFood(state.food[0], state.food[1]);
      if (state.snake) drawSnake(state.snake);
      updateAndDrawParticles();
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;

      if (delta >= TICK_INTERVAL) {
        lastTime = timestamp;
        if (state.status._tag === 'Playing') {
          const prevScore = state.score;
          const nextRandomFood = getRandomFood(state.snake);
          state = step(state, nextRandomFood);

          if (state.score > prevScore) {
            playSound('eat');
            spawnParticles(state.food[0], state.food[1]);
          }
          if (state.status._tag === 'GameOver') {
            playSound('die');
          }
          updateUI();
        }
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function handleKey(e) {
      initAudio();
      const code = e.code;

      if (code === 'ArrowUp' || code === 'KeyW') {
        state = changeDir(state, Up);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'ArrowDown' || code === 'KeyS') {
        state = changeDir(state, Down);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'ArrowLeft' || code === 'KeyA') {
        state = changeDir(state, Left);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'ArrowRight' || code === 'KeyD') {
        state = changeDir(state, Right);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'Space') {
        if (document.activeElement === playerNameInput) return;
        e.preventDefault();
        if (state.status._tag === 'Ready') {
          state = startGame(state);
        } else {
          state = togglePause(state);
        }
        updateUI();
      } else if (code === 'KeyR') {
        if (document.activeElement === playerNameInput) return;
        state = initGame(COLS, ROWS, highScore);
        state = startGame(state);
        updateUI();
      }
    }

    function handleStart() {
      initAudio();
      const status = state.status._tag;
      if (status === 'GameOver' || status === 'Ready') {
        state = initGame(COLS, ROWS, highScore);
        state = startGame(state);
      } else if (status === 'Paused') {
        state = togglePause(state);
      }
      updateUI();
    }

    window.addEventListener('keydown', handleKey);
    startBtn.addEventListener('click', handleStart);

    updateUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
