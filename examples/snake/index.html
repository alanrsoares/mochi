<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Canvas Snake</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
    {
      "imports": {
        "@onrails/pattern": "/node_modules/@onrails/pattern/dist/index.js"
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-green: #00ff87;
      --accent-green-glow: rgba(0, 255, 135, 0.4);
      --accent-pink: #ff007f;
      --accent-pink-glow: rgba(255, 0, 127, 0.5);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --grid-color: rgba(255, 255, 255, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 255, 135, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 45%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 1rem 1.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-green), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-badge {
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 255, 135, 0.12);
      color: var(--accent-green);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      border: 1px solid rgba(0, 255, 135, 0.25);
    }

    .scores {
      display: flex;
      gap: 1.5rem;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .score-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .score-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-green);
      text-shadow: 0 0 10px var(--accent-green-glow);
    }

    .score-value.high {
      color: #f59e0b;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--card-border);
      background: #0d121f;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .overlay-title.game-over {
      color: var(--accent-pink);
      text-shadow: 0 0 20px var(--accent-pink-glow);
    }

    .overlay-title.paused {
      color: #60a5fa;
    }

    .overlay-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      max-width: 300px;
      line-height: 1.4;
    }

    .btn {
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.8rem 1.8rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-green), #059669);
      color: #042f1a;
      box-shadow: 0 6px 20px var(--accent-green-glow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 255, 135, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .controls-legend {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1rem;
      border-radius: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .key-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 0.15rem 0.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-main);
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-width: 200px;
      margin: 0 auto;
    }

    .dbtn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .dbtn:active {
      background: rgba(0, 255, 135, 0.2);
    }

    @media (min-width: 640px) {
      .dpad {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-badge">Mochi</span> Snake
        <span class="sub-badge">Compiled JS</span>
      </div>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">Score</span>
          <span class="score-value" id="score-val">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">High Score</span>
          <span class="score-value high" id="high-val">0</span>
        </div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="game-canvas" width="600" height="600"></canvas>
      
      <div class="overlay visible" id="overlay">
        <div class="overlay-title" id="overlay-title">Ready?</div>
        <div class="overlay-subtitle" id="overlay-sub">Press Space or Start Game to play. Use Arrow keys or WASD to navigate.</div>
        <button class="btn" id="start-btn">Start Game</button>
      </div>
    </div>

    <div class="controls-legend">
      <div class="key-group"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</div>
      <div class="key-group"><kbd>Space</kbd> Pause</div>
      <div class="key-group"><kbd>R</kbd> Restart</div>
    </div>

    <div class="dpad">
      <div></div>
      <button class="dbtn" id="btn-up">▲</button>
      <div></div>
      <button class="dbtn" id="btn-left">◀</button>
      <button class="dbtn" id="btn-down">▼</button>
      <button class="dbtn" id="btn-right">▶</button>
    </div>
  </div>

  <script type="module">
    import { initGame, step, changeDir, startGame, togglePause } from './snake.js';

    // Mochi Variant Constructors
    const Up = { _tag: "Up" };
    const Down = { _tag: "Down" };
    const Left = { _tag: "Left" };
    const Right = { _tag: "Right" };

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const scoreVal = document.getElementById('score-val');
    const highVal = document.getElementById('high-val');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');

    const COLS = 20;
    const ROWS = 20;
    const CELL_SIZE = canvas.width / COLS;

    let highScore = parseInt(localStorage.getItem('mochi_snake_highscore') || '0', 10);
    highVal.textContent = highScore;

    let state = initGame(COLS, ROWS, highScore);
    let lastTime = 0;
    const TICK_INTERVAL = 110; // ms per tick

    // Simple Web Audio API Sound Synthesizer
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'die') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.35);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        }
      } catch (e) {}
    }

    function getRandomFood(snake) {
      let candidate;
      let valid = false;
      while (!valid) {
        const rx = Math.floor(Math.random() * COLS);
        const ry = Math.floor(Math.random() * ROWS);
        candidate = [rx, ry];
        valid = !snake.some(([sx, sy]) => sx === rx && sy === ry);
      }
      return candidate;
    }

    function updateUI() {
      scoreVal.textContent = state.score;
      if (state.highScore > highScore) {
        highScore = state.highScore;
        highVal.textContent = highScore;
        localStorage.setItem('mochi_snake_highscore', highScore.toString());
      }

      const status = state.status._tag;
      if (status === 'Ready') {
        overlayTitle.textContent = 'Ready?';
        overlayTitle.className = 'overlay-title';
        overlaySub.textContent = 'Press Space or click Start to begin.';
        startBtn.textContent = 'Start Game';
        overlay.classList.add('visible');
      } else if (status === 'Paused') {
        overlayTitle.textContent = 'Paused';
        overlayTitle.className = 'overlay-title paused';
        overlaySub.textContent = 'Press Space to resume.';
        startBtn.textContent = 'Resume';
        overlay.classList.add('visible');
      } else if (status === 'GameOver') {
        overlayTitle.textContent = 'Game Over';
        overlayTitle.className = 'overlay-title game-over';
        overlaySub.textContent = `Score: ${state.score}  •  High Score: ${state.highScore}`;
        startBtn.textContent = 'Play Again';
        overlay.classList.add('visible');
      } else {
        overlay.classList.remove('visible');
      }
    }

    function drawGrid() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let c = 0; c <= COLS; c++) {
        ctx.beginPath();
        ctx.moveTo(c * CELL_SIZE, 0);
        ctx.lineTo(c * CELL_SIZE, canvas.height);
        ctx.stroke();
      }
      for (let r = 0; r <= ROWS; r++) {
        ctx.beginPath();
        ctx.moveTo(0, r * CELL_SIZE);
        ctx.lineTo(canvas.width, r * CELL_SIZE);
        ctx.stroke();
      }
    }

    function drawFood(x, y) {
      const px = x * CELL_SIZE + CELL_SIZE / 2;
      const py = y * CELL_SIZE + CELL_SIZE / 2;
      const radius = CELL_SIZE / 2 - 3;

      // Glow effect
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 15;

      ctx.fillStyle = '#ff007f';
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, Math.PI * 2);
      ctx.fill();

      // Inner shine
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(px - radius * 0.3, py - radius * 0.3, radius * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSnake(snake) {
      ctx.shadowColor = '#00ff87';
      ctx.shadowBlur = 10;

      snake.forEach(([x, y], idx) => {
        const px = x * CELL_SIZE;
        const py = y * CELL_SIZE;
        const pad = 2;
        const size = CELL_SIZE - pad * 2;
        const isHead = idx === 0;

        ctx.fillStyle = isHead ? '#00ff87' : 'rgba(0, 255, 135, 0.75)';
        
        // Draw rounded rectangle segment
        ctx.beginPath();
        ctx.roundRect(px + pad, py + pad, size, size, isHead ? 6 : 4);
        ctx.fill();

        // Draw eyes on head
        if (isHead) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#042f1a';
          const eyeSize = 3;
          ctx.beginPath();
          ctx.arc(px + size * 0.35, py + size * 0.35, eyeSize, 0, Math.PI * 2);
          ctx.arc(px + size * 0.65, py + size * 0.35, eyeSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = '#00ff87';
          ctx.shadowBlur = 10;
        }
      });

      ctx.shadowBlur = 0;
    }

    function render() {
      ctx.fillStyle = '#0d121f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      if (state.food) drawFood(state.food[0], state.food[1]);
      if (state.snake) drawSnake(state.snake);
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;

      if (delta >= TICK_INTERVAL) {
        lastTime = timestamp;
        if (state.status._tag === 'Playing') {
          const prevScore = state.score;
          const nextRandomFood = getRandomFood(state.snake);
          state = step(state, nextRandomFood);

          if (state.score > prevScore) {
            playSound('eat');
          }
          if (state.status._tag === 'GameOver') {
            playSound('die');
          }
          updateUI();
        }
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function handleKey(e) {
      initAudio();
      const code = e.code;

      if (code === 'ArrowUp' || code === 'KeyW') {
        state = changeDir(state, Up);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'ArrowDown' || code === 'KeyS') {
        state = changeDir(state, Down);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'ArrowLeft' || code === 'KeyA') {
        state = changeDir(state, Left);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'ArrowRight' || code === 'KeyD') {
        state = changeDir(state, Right);
        if (state.status._tag === 'Ready') state = startGame(state);
      } else if (code === 'Space') {
        e.preventDefault();
        if (state.status._tag === 'Ready') {
          state = startGame(state);
        } else {
          state = togglePause(state);
        }
        updateUI();
      } else if (code === 'KeyR') {
        state = initGame(COLS, ROWS, highScore);
        state = startGame(state);
        updateUI();
      }
    }

    function handleStart() {
      initAudio();
      const status = state.status._tag;
      if (status === 'GameOver' || status === 'Ready') {
        state = initGame(COLS, ROWS, highScore);
        state = startGame(state);
      } else if (status === 'Paused') {
        state = togglePause(state);
      }
      updateUI();
    }

    window.addEventListener('keydown', handleKey);
    startBtn.addEventListener('click', handleStart);

    document.getElementById('btn-up').addEventListener('click', () => { handleKey({ code: 'ArrowUp' }); });
    document.getElementById('btn-down').addEventListener('click', () => { handleKey({ code: 'ArrowDown' }); });
    document.getElementById('btn-left').addEventListener('click', () => { handleKey({ code: 'ArrowLeft' }); });
    document.getElementById('btn-right').addEventListener('click', () => { handleKey({ code: 'ArrowRight' }); });

    updateUI();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
